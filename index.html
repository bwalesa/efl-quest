<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFL Quest - Level Select</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-700 min-h-screen flex justify-center items-center p-8">

    <div class="bg-white p-10 rounded-3xl shadow-2xl border border-slate-200 w-full max-w-xl">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-indigo-900 tracking-tight mb-2">EFL Quest</h1>
            <p class="text-slate-500 font-medium">Select your learning path to begin.</p>
        </div>

        <div class="space-y-6">
            <!-- Selector de Unidad -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">1. Choose a Unit</label>
                <select id="unit-select" class="w-full p-4 border-2 border-slate-200 rounded-xl outline-none font-black text-slate-700 bg-slate-50 focus:border-indigo-500 cursor-pointer text-lg transition-colors"></select>
            </div>

            <!-- Selector de Misión -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">2. Select Mission</label>
                <select id="mission-select" class="w-full p-4 border-2 border-slate-200 rounded-xl outline-none font-black text-slate-700 bg-slate-50 focus:border-indigo-500 cursor-pointer text-lg transition-colors"></select>
            </div>

            <button onclick="launchGame()" class="w-full mt-8 bg-green-500 hover:bg-green-600 text-white font-black text-2xl py-5 rounded-2xl shadow-[0_6px_0_rgb(21,128,61)] active:translate-y-1.5 active:shadow-none transition-all">
                ▶ START QUEST
            </button>
        </div>
    </div>

    <!-- CONEXIÓN DE BASE DE DATOS -->
    <script src="database.js"></script>

    <script>
        window.onload = () => {
            // 1. Llenar Unidades
            const uSelect = document.getElementById('unit-select');
            for (const [key, val] of Object.entries(GAME_DATABASE.units)) {
                uSelect.innerHTML += `<option value="${key}">${val.title}</option>`;
            }

            // 2. Activar el actualizador dinámico de misiones
            uSelect.addEventListener('change', updateMissions);
            
            // Cargar las misiones de la primera unidad por defecto al abrir la página
            updateMissions();
        };

        function updateMissions() {
            const uSelect = document.getElementById('unit-select');
            const mSelect = document.getElementById('mission-select');
            const selectedUnit = uSelect.value;
            
            mSelect.innerHTML = ''; // Limpiar misiones anteriores
            
            // Buscar los niveles específicos de la unidad seleccionada
            const levels = GAME_DATABASE.units[selectedUnit].levels;
            for (const [key, val] of Object.entries(levels)) {
                mSelect.innerHTML += `<option value="${key}">${val.title}</option>`;
            }
        }

        function launchGame() {
            const studentConfig = {
                unit_id: document.getElementById('unit-select').value,
                mission_id: document.getElementById('mission-select').value
            };

            // Guarda la selección en la memoria y salta al juego
            localStorage.setItem('studentLevelConfig', JSON.stringify(studentConfig));
            window.location.href = 'playground.html';
        }
    </script>
</body>
</html>
