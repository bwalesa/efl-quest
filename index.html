<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFL Quest - Level Select</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-slate-100 font-sans text-slate-700 h-screen w-screen flex justify-center items-center p-2 overflow-hidden m-0">

    <div class="bg-white px-5 py-3 rounded-2xl shadow-xl border border-slate-200 w-full max-w-xl flex flex-col justify-center">
        <div class="text-center mb-2">
            <h1 class="text-xl font-black text-indigo-900 tracking-tight">EFL Quest</h1>
            <p class="text-[10px] text-slate-500 font-medium">Select your learning path to begin.</p>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
            <!-- Selector de Unidad -->
            <div>
                <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">1. Choose a Unit</label>
                <select id="unit-select" class="w-full p-1.5 border-2 border-slate-200 rounded-lg outline-none font-bold text-slate-700 bg-slate-50 focus:border-indigo-500 cursor-pointer text-xs"></select>
            </div>

            <!-- Selector de Misión -->
            <div>
                <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">2. Select Mission</label>
                <select id="mission-select" class="w-full p-1.5 border-2 border-slate-200 rounded-lg outline-none font-bold text-slate-700 bg-slate-50 focus:border-indigo-500 cursor-pointer text-xs"></select>
            </div>
        </div>

        <button onclick="launchGame()" class="w-full bg-green-500 hover:bg-green-600 text-white font-black text-sm py-2.5 rounded-xl shadow-[0_3px_0_rgb(21,128,61)] active:translate-y-1 active:shadow-none transition-all cursor-pointer">
            START QUEST
        </button>
    </div>

    <!-- CONEXIÓN DE BASE DE DATOS -->
    <script src="database.js"></script>

    <script>
        window.onload = () => {
            const uSelect = document.getElementById('unit-select');
            for (const [key, val] of Object.entries(GAME_DATABASE.units)) {
                uSelect.innerHTML += `<option value="${key}">${val.title}</option>`;
            }

            uSelect.addEventListener('change', updateMissions);
            updateMissions();
        };

        function updateMissions() {
            const uSelect = document.getElementById('unit-select');
            const mSelect = document.getElementById('mission-select');
            const selectedUnit = uSelect.value;
            
            mSelect.innerHTML = ''; 
            const levels = GAME_DATABASE.units[selectedUnit].levels;
            for (const [key, val] of Object.entries(levels)) {
                mSelect.innerHTML += `<option value="${key}">${val.title}</option>`;
            }
        }

        function launchGame() {
            const studentConfig = {
                unit_id: document.getElementById('unit-select').value,
                mission_id: document.getElementById('mission-select').value
            };

            localStorage.setItem('studentLevelConfig', JSON.stringify(studentConfig));
            window.location.href = 'playground.html';
        }
    </script>
</body>

    <!-- CONEXIÓN DE BASE DE DATOS -->
    <script src="database.js"></script>

    <script>
        window.onload = () => {
            // 1. Llenar Unidades
            const uSelect = document.getElementById('unit-select');
            for (const [key, val] of Object.entries(GAME_DATABASE.units)) {
                uSelect.innerHTML += `<option value="${key}">${val.title}</option>`;
            }

            // 2. Activar el actualizador dinámico de misiones
            uSelect.addEventListener('change', updateMissions);
            
            // Cargar las misiones de la primera unidad por defecto al abrir la página
            updateMissions();
        };

        function updateMissions() {
            const uSelect = document.getElementById('unit-select');
            const mSelect = document.getElementById('mission-select');
            const selectedUnit = uSelect.value;
            
            mSelect.innerHTML = ''; // Limpiar misiones anteriores
            
            // Buscar los niveles específicos de la unidad seleccionada
            const levels = GAME_DATABASE.units[selectedUnit].levels;
            for (const [key, val] of Object.entries(levels)) {
                mSelect.innerHTML += `<option value="${key}">${val.title}</option>`;
            }
        }

        function launchGame() {
            const studentConfig = {
                unit_id: document.getElementById('unit-select').value,
                mission_id: document.getElementById('mission-select').value
            };

            // Guarda la selección en la memoria y salta al juego
            localStorage.setItem('studentLevelConfig', JSON.stringify(studentConfig));
            window.location.href = 'playground.html';
        }
    </script>
</body>
</html>
